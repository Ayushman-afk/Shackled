<!DOCTYPE html>
<html lang="en">
<style>
    #playscreen {
        display: none;
    }
</style>
<head>
    <meta charset="UTF-8">

    <title>Shackled</title>

    <link rel="stylesheet" href ="https://pyscript.net/releases/2026.7.3/core.css">

    <script type = "module" src ="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alien+Block&display=swap" rel="stylesheet">


    <style> body {
        text-align: center;
        background-image:url("./assets/Background.jpg");
        font-family: "Orbitron";
        justify-content: center;
        display: flex;
        align-items: center;
        min-height: 100vh;
        flex-direction: column;

    }</style>

    <style>h1 {
        font-size: 95px;
        text-shadow: 0 0 50px #c084fc;
    }</style>
    <style> p  {
        font-size: 55px;
        margin-top: -50px;
        font-family: AlienBlock;
        color: lightgray;
    }</style>

    <style>button {
        font-size: 26px;
        width: 250px;
        height: 35px;
        background: darkviolet;
        margin-top: 10px;
        font-weight: bolder;
        color: whitesmoke;

    }</style>

    <style>button:hover {
        background-color: #8b5cf6;
        box-shadow: 0 0 20px white;
    }</style>

    <style>
        #mainmenu button {
            display: block;
            margin: 10px auto;
        }
    </style>

</head>

<body>
    <div id="mainmenu">
    <h1>Shackled</h1>
    <p>A Chaotic Multiplayer co-op Game</p>
    <button id="mainscreenplay" onclick="goToPlayScreen()">Play</button>
    <button id="mainscreensettings">Settings</button>
    </div>

<div id="playscreen">
    <h2>Choose Your Mode</h2>
    <button id="solo">Solo</button>
    <button id="twoplayer">2 Player</button>



</div>

<script>
    function goToPlayScreen() {
        document.getElementById('mainmenu').style.display = 'none';

        document.getElementById('playscreen').style.display = 'block';
    }
</script>


<script type="py" src="./main.py"></script>
